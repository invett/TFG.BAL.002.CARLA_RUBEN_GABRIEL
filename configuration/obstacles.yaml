
# YAML file: obstacles.yaml
# This is a configuration file for the CARLA simulator in YAML format that contains all the information necessary to
# generate a set of props specified in the official CARLA documentation (https://carla.readthedocs.io/en/latest/catalogue_props/)
# information that will be read by a script to use the data to moify maps and simulate roadblocks 
# in different areas of the simulator's predefined environements.
# This file is divided into different scenarios, each with the following fields:
#
#           - Map: The map for wich the roadblock is designed (Town02, Town03, Town04,...)
#           - Description: A brief description of what eacho roadblock contins
#           - Props: A list of the props used to generate and simulate the roadblock
#           - Prop ID: The ID used to search for props in the CARLA blueprints and generate them
#           - Transforms: Each prop has different transform fiels wich contains the location (x, y, z) and the rotation (pitch, yaw, roll) where the prop will be placed
#
# This file can be modified or expanded to generate other types of roadblocks on additional maps or change the props used for existing roadblocks in the YAML file
# To do so, the following considerations must be taken into account:
#
#           - Unreal Engine handles rotations differently than CARLA: 
#                   + Unreal Rotation -> roll, pitch, yaw 
#                   + CARLA Rotation -> pitch, yaw, roll (practical use decided by the CARLA team to match their Python classes)
#           - In Unreal Engine, positions are given in meters (example: X= 14610.0 in Unreal | X = 146.10 in CARLA)

#- transform:
#            
#            location: {x: ,y: ,z: }
#            rotation: {pitch: ,yaw: ,roll: }

scenarios:

  blocked_street01_Town02: #roadblock type identifier

    map: "Town02"  
    description: |
        First roadblock consisting of a single closed street in Town02. 
        This roadblock consists of 2 road barriers (static.prop.streetbarrier) 
        and 2 traffic cones (static.prop.trafficcone01), Both taken from the CARLA props catalog, placed across the width of the road, 
        simulating a roadblock due to construction work.

    props: #List of props

      static.prop.streetbarrier: #Props ID

        - transform: #coordinates and rotations for generating props in their respective locations 

            location: {x: 45.91, y: 250.181, z: 0.02}
            rotation: {pitch: 0.0 , yaw: 0.0 , roll: 0.0}

        - transform:

            location: {x: 41.80 , y: 250.20 ,z: 0.02}
            rotation: {pitch: 0.0 , yaw: 0.0, roll: 0.02 }

      static.prop.trafficcone01:
        
